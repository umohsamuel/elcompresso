# Deploys the Go API to the shared EC2 instance (also hosts the portfolio,
# kakcil and distributed-sockets). Host nginx + certbot own ports 80/443 there,
# so the API binds to 127.0.0.1:$API_PORT and nginx proxies the API domain to it.
#
# GitHub "production" environment:
#   secrets  EC2_HOST, EC2_SSH_KEY, REDIS_PASSWORD, RABBITMQ_PASSWORD
#   vars     API_DOMAIN, ALLOWED_ORIGINS, EC2_USER (optional, default ubuntu),
#            AWS_BUCKET + AWS_REGION (optional: direct-to-S3 uploads and results)
# Processing limits live in deploy/limits.env.

name: Deploy backend

on:
  push:
    branches: [prod]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# The instance is shared, so never run two deploys at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test -short ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      APP_DIR: elcompresso
      IMAGE: elcompresso-api:latest
      API_PORT: "9003"
      API_DOMAIN: ${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          missing=0
          for name in EC2_HOST EC2_SSH_KEY API_DOMAIN ALLOWED_ORIGINS REDIS_PASSWORD RABBITMQ_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in the production environment"; missing=1; fi
          done
          exit $missing

      # Built here rather than on the instance, which is small and shared.
      - name: Build image
        run: docker build -t "$IMAGE" backend

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          ssh ec2 'echo "connected to $(hostname)"; df -h / | tail -1'

      # Only deploy/ is needed on the server; the image carries the code.
      # --delete keeps it in sync but never touches the server's .env.
      - name: Upload deploy files
        run: |
          ssh ec2 "mkdir -p ~/$APP_DIR"
          rsync -az --delete --exclude '.env' deploy ec2:"$APP_DIR/"

      # With AWS_BUCKET set, browsers upload straight to S3 and results are
      # served from it; the instance's IAM role provides the credentials.
      - name: Write deploy/.env
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          {
            printf 'API_DOMAIN=%s\nALLOWED_ORIGINS=%s\nAPI_PORT=%s\n' "$API_DOMAIN" "$ALLOWED_ORIGINS" "$API_PORT"
            # Compose reads these for the redis/rabbitmq containers and the app's URLs.
            printf 'REDIS_PASSWORD=%s\nRABBITMQ_USER=elcompresso\nRABBITMQ_PASSWORD=%s\n' "$REDIS_PASSWORD" "$RABBITMQ_PASSWORD"
            if [ -n "$AWS_BUCKET" ]; then
              printf 'STORAGE_TYPE=s3\nAWS_BUCKET=%s\nAWS_REGION=%s\n' "$AWS_BUCKET" "$AWS_REGION"
            fi
          } | ssh ec2 "umask 077 && cat > ~/$APP_DIR/deploy/.env"

      # Large encodes can spike memory past what the box has free; swap keeps
      # the OOM killer away from the other apps. Only added once.
      - name: Ensure swap
        run: |
          ssh ec2 'bash -s' <<'EOF'
          set -euo pipefail
          if swapon --show | grep -q /swapfile; then exit 0; fi
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
          EOF

      # Free space from the previous image first.
      - name: Upload image
        run: |
          ssh ec2 "docker image prune -f >/dev/null"
          docker save "$IMAGE" | gzip | ssh ec2 "gunzip | docker load"

      - name: Start container
        run: |
          ssh ec2 "cd ~/$APP_DIR/deploy && docker compose up -d --no-build --remove-orphans && docker image prune -f >/dev/null && docker compose ps"

      # Installs the nginx site and gets a certificate until certbot has taken
      # it over; after that the site file on the server is left alone.
      - name: Configure nginx
        run: |
          ssh ec2 "bash -s -- $API_DOMAIN $API_PORT $APP_DIR" <<'EOF'
          set -euo pipefail
          domain="$1"; port="$2"; dir="$HOME/$3"
          conf="/etc/nginx/sites-available/$domain"
          if sudo grep -q "managed by Certbot" "$conf" 2>/dev/null; then
            exit 0
          fi
          sed -e "s/__API_DOMAIN__/$domain/g" -e "s/__API_PORT__/$port/g" "$dir/deploy/nginx.conf" \
            | sudo tee "$conf" >/dev/null
          sudo ln -sf "$conf" "/etc/nginx/sites-enabled/$domain"
          sudo nginx -t
          sudo systemctl reload nginx
          sudo certbot --nginx -d "$domain" --non-interactive --agree-tos --redirect
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "https://$API_DOMAIN/health"; then
              echo; echo "Healthy: https://$API_DOMAIN"; exit 0
            fi
            sleep 6
          done
          echo "::error::https://$API_DOMAIN/health did not respond"
          ssh ec2 "cd ~/$APP_DIR/deploy && docker compose ps && docker compose logs --tail=80"
          exit 1

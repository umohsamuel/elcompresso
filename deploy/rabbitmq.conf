# A worker holds a job's message unacknowledged for the whole encode.
# RabbitMQ's default consumer timeout (30 min) would close its channel during
# long encodes, so allow 3 h (well above JOB_TIMEOUT).
consumer_timeout = 10800000

# The broker only holds job ids; keep its footprint small on a shared box.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 200MB

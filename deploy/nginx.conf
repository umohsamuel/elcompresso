# Host nginx site for the API. __API_DOMAIN__ and __API_PORT__ are filled in by
# the deploy workflow, which installs this once and lets certbot add TLS;
# later edits go on the server (/etc/nginx/sites-available/<domain>).
server {
    listen 80;
    server_name __API_DOMAIN__;

    # Slightly above MAX_VIDEO_MB in limits.env (multipart overhead).
    client_max_body_size 550m;

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;

        # Stream uploads and downloads instead of spooling them to disk first:
        # the instance is short on disk, and the API reports upload progress.
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 15m;
        proxy_read_timeout 15m;
    }
}
